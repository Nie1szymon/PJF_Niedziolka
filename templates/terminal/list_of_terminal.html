{% extends 'base.html' %}

{% block content %}
<body>
    <h1>List of Terminals</h1>
    <table>
        <thead>
            <tr>
                <th>Name</th>
                <th>Model</th>
                <th>Stan</th>
                <th>Next Stan</th>
                <th>Action</th>
            </tr>
        </thead>
        <tbody>
            {% for terminal in terminals %}
            <tr>
                <td>{{ terminal.name }}</td>
                <td>{{ terminal.model.name }}</td>
                <td>{{ terminal.stan.name }}</td>
                <td>{{ terminal.next_stan.name }}</td>
                <td>
                    <form method="post" action="{% url 'change_terminal_stan' terminal.id %}">
                            {% csrf_token %}
                            <input type="submit"  value="zmien Stan">
                        </form>
                </td>
            </tr>
            {% endfor %}
        </tbody>
    </table>

</body>

{% endblock %}
